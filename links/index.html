<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#5c5967">
  <meta name="description" content="Nail art, esmaltação em gel e formação com Nathália Parteka.">
  <meta property="og:title" content="Nathália Parteka · Nail Art">
  <meta property="og:description" content="Nail art · Esmaltação em Gel · Molde F1">
  <meta property="og:image" content="https://www.nathaliaparteka.com.br/assets/img/linktree/nathalia-avatar.jpeg">
  <meta property="og:image:alt" content="Nathália Parteka">
  <meta property="og:image:type" content="image/jpeg">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:image" content="https://www.nathaliaparteka.com.br/assets/img/linktree/nathalia-avatar.jpeg">
  <title>Nathália Parteka · Nail Art</title>
  <link rel="icon" type="image/png" href="../assets/img/linktree/favicon-nathalia.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      font-family: "DM Sans", sans-serif;
      background: #696575;
    }

    .links-page {
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 0;
      background: radial-gradient(circle at 50% 30%, #fff, transparent 46%), #e8e8e8;
    }

    .links-shell {
      position: relative;
      width: min(calc(100% - 1.5rem), 317px);
      min-height: 646px;
      padding: 0 10px 14px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .62);
      border-radius: 19px;
      background: linear-gradient(180deg, #736f7b 0%, #696575 54%, #696575 100%);
      box-shadow: 0 18px 36px rgba(35, 33, 45, .2), inset 0 1px rgba(255, 255, 255, .42);
      width: 100%;
      height: 100%;
    }

    .links-header {
      position: relative;
      width: calc(100% + 20px);
      height: 330px;
      margin-left: -10px;
      overflow: hidden;
      border-radius: 18px 18px 0 0;
      text-align: center;
    }

    .links-header::after {
      position: absolute;
      inset: 24% 0 0;
      z-index: 1;
      background: linear-gradient(180deg, transparent 30%, rgba(55, 52, 66, .18) 56%, #696575 100%);
      content: "";
      pointer-events: none;
    }

    .links-header-actions {
      position: absolute;
      inset: 0 0 auto;
      z-index: 4;
      display: flex;
      padding: 15px 15px 15px 15px;
      justify-content: flex-end;
    }

    .links-action,
    .links-share {
      display: grid;
      width: 40px;
      height: 40px;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, .2);
      border-radius: 50%;
      color: #fff;
      background: rgba(43, 40, 49, .66);
      box-shadow: inset 0 1px rgba(255, 255, 255, .18);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .links-share {
      padding: 0;
      cursor: pointer;
    }

    .links-share:hover {
      background: rgba(74, 68, 84, .86);
    }

    .links-avatar {
      display: block;
      width: 100%;
      height: 330px;
      object-fit: cover;
      object-position: center;
      opacity: .96;
    }

    .links-identity {
      position: absolute;
      right: 0;
      bottom: 5px;
      left: 0;
      z-index: 3;
      animation: profile-rise 700ms both cubic-bezier(.2, .8, .2, 1);
    }

    h1 {
      margin: 0;
      color: #fff;
      font-size: 28px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -.045em;
      text-shadow: 0 2px 10px rgba(24, 21, 30, .35);
    }

    .links-bio {
      margin: 8px 0 0;
      color: rgba(255, 255, 255, .92);
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      padding-bottom: 20px;
    }

    .links-bio span {
      padding: 0 4px;
      color: rgba(255, 255, 255, .72);
    }

    .links-list {
      display: grid;
      gap: 9px;
      margin-top: -1px;
    }

    .link-feature {
      position: relative;
      display: block;
      height: 220px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .27);
      border-radius: 12px;
      background: rgba(105, 101, 117, .34);
      box-shadow: 0 7px 14px rgba(25, 22, 36, .22), inset 0 1px rgba(255, 255, 255, .24);
      backdrop-filter: blur(18px) saturate(130%);
      -webkit-backdrop-filter: blur(18px) saturate(130%);
      text-decoration: none;
      animation: link-reveal 650ms 120ms both cubic-bezier(.2, .8, .2, 1);
    }

    .link-feature img {
      display: block;
      width: calc(100% - 16px);
      height: 160px;
      margin: 8px;
      border-radius: 7px;
      object-fit: cover;
    }

    .link-feature::after {
      position: absolute;
      inset: 50% 0 0;
      background: linear-gradient(180deg, transparent, rgba(82, 78, 94, .4));
      content: "";
      pointer-events: none;
    }

    .link-feature-caption {
      position: absolute;
      right: 35px;
      bottom: 17px;
      left: 35px;
      z-index: 1;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
    }

    .link-card {
      position: relative;
      display: flex;
      min-height: 55px;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .27);
      border-radius: 11px;
      color: #fff;
      background: linear-gradient(135deg, rgba(161, 157, 174, .34), rgba(105, 101, 121, .34));
      box-shadow: 0 6px 13px rgba(25, 22, 36, .2), inset 0 1px rgba(255, 255, 255, .23);
      backdrop-filter: blur(20px) saturate(135%);
      -webkit-backdrop-filter: blur(20px) saturate(135%);
      text-decoration: none;
      animation: link-reveal 650ms var(--delay) both cubic-bezier(.2, .8, .2, 1);
      transition: transform 180ms ease, background 180ms ease, box-shadow 180ms ease;
    }

    .link-card::before {
      position: absolute;
      inset: 0;
      background: linear-gradient(110deg, rgba(255, 255, 255, .16), transparent 42%, rgba(255, 255, 255, .05));
      content: "";
      pointer-events: none;
    }

    .link-card:hover {
      background-color: rgba(190, 185, 204, .48);
      box-shadow: 0 9px 18px rgba(25, 22, 36, .3), inset 0 1px rgba(255, 255, 255, .38);
      transform: translateY(-2px);
    }

    .link-card strong {
      position: relative;
      z-index: 1;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
    }

    @keyframes profile-rise {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes link-reveal {
      from {
        opacity: 0;
        transform: translateY(14px) scale(.985);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (max-width: 639px) {
      body { background: #696575; }
      .links-page { min-height: 100svh; place-items: start center; overflow-x: hidden; background: #696575; }
      .links-shell { width: 100%; min-height: calc(100svh - 18px); margin: 0; padding-bottom: 22px; border: 0; border-radius: 0; box-shadow: none; }
    }

    @media (prefers-reduced-motion: reduce) {

      .links-identity,
      .link-card,
      .link-feature {
        animation: none;
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main class="links-page">
    <section class="links-shell" aria-label="Perfil de Nathália Parteka">
      <header class="links-header">
        <div class="links-header-actions"><button
            class="links-share" type="button" aria-label="Compartilhar página" onclick="sharePage()"><svg width="15"
              height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="18" cy="5" r="3" />
              <circle cx="6" cy="12" r="3" />
              <circle cx="18" cy="19" r="3" />
              <path d="m8.59 13.51 6.83 3.98M15.41 6.51 8.59 10.49" />
            </svg></button></div><img class="links-avatar" src="../assets/img/linktree/avatar.jpeg"
          alt="Nathália Parteka">
        <div class="links-identity">
          <h1>Nathália Parteka</h1>
          <p class="links-bio">Nail art <span>·</span> Esmaltação em Gel <span>·</span> Molde F1</p>
        </div>
      </header>
      <section class="links-list" aria-label="Links principais"><a class="link-feature"
          href="https://www.nathaliaparteka.com.br/formacao" target="_blank" rel="noreferrer"><img
            src="../assets/img/linktree/curso.jpeg" alt="Nail art em esmaltação em gel"><span
            class="link-feature-caption">Curso Esmaltação em Gel</span></a><a class="link-card" style="--delay: 200ms"
          href="https://nathaliaparteka.com.br/" target="_blank" rel="noreferrer"><strong>Serviços e
            Valores</strong></a><a class="link-card" style="--delay: 280ms" href="https://wa.me/message/RC547FBKEJP6A1"
          target="_blank" rel="noreferrer"><strong>WhatsApp</strong></a></section>
    </section>
  </main>
  <script>async function sharePage() { const data = { title: 'Nathália Parteka', text: 'Nail art · Esmaltação em Gel · Molde F1', url: window.location.href }; if (navigator.share) { try { await navigator.share(data) } catch (_) { } } else if (navigator.clipboard) { await navigator.clipboard.writeText(window.location.href) } }</script>
</body>

</html>
